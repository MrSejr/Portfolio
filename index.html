<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio · Tech &amp; Japan</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
/* ─────────────────────────────────────────────
   TOKENS

   Two voices, held in tension:
     mono     the machine — indices, labels, captions
     display  Mincho serif — names, titles, the human bits

   Four skies, crossfaded on section change:
     night → deep blue → seal crimson → daylight
   ───────────────────────────────────────────── */
:root{
  --mono:ui-monospace,'SF Mono','JetBrains Mono','IBM Plex Mono',Menlo,Consolas,monospace;
  --display:'Hiragino Mincho ProN','Yu Mincho','Songti SC','Noto Serif JP',Georgia,serif;
  --body:'Hiragino Sans','Yu Gothic UI','Helvetica Neue',Arial,sans-serif;

  --shu:#CE1F2E;
  --washi-hi:#F4F2ED;

  --ink:#E9E7E1;
  --ink-soft:rgba(233,231,225,.62);
  --ink-faint:rgba(233,231,225,.34);
  --hair:rgba(233,231,225,.22);

}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background-color:#050608;
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;      /* sideways, never; downwards, freely */
}

/* ── the sky: one fixed gradient, never moves ── */
/* ── the sky: one fixed gradient, never moves ── */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,
  #010101 0%, #010101 25%, #0A0C10 30%, #1B2134 40%, #313959 50%,
  #47547F 60%, #838D94 70%, #A1A6A2 75%, #BAB9B5 80%, #C8C4BF 85%,
  #D4D0CA 90%, #DCDBD5 95%, #E6E4E0 100%)}

::selection{background:var(--shu);color:var(--washi-hi)}
a{color:inherit}

/* ── shared mono treatment ── */
.mono{
  font-family:var(--mono);
  font-size:.79rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-weight:400;
}

/* ─────────────────────────────────────────────
   HERO — which is now the whole site

   One screen: the business card and the project index down the
   left, the seal keeping the lower right it was always drawn for.
   Nothing scrolls unless the window is too small to hold it all,
   and then it scrolls like a page, not like a story.
   ───────────────────────────────────────────── */
.hero{
  /* Exactly one screen. The page itself never scrolls; the column of
     projects scrolls inside it, which keeps the card, the contact and
     the seal permanently in place and means a given height on the
     screen always has the same sky behind it. */
  position:relative;z-index:2;height:100svh;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,80ch) 1fr;
  align-content:start;
  gap:clamp(1.4rem,3.4vh,2.6rem);
  padding:clamp(1.7rem,4.4vh,3.2rem) clamp(1.6rem,4.5vw,3.4rem);
}
.hero-left{grid-column:1;display:flex;flex-direction:column;
  gap:clamp(1.3rem,3.2vh,2.4rem);min-width:0;min-height:0;height:100%}

.meta{
  position:static;                       /* it sits in the left column now */
  font-family:var(--mono);font-size:clamp(.77rem,1vw,.88rem);
  line-height:1.55;letter-spacing:.08em;color:#FFFFFF;opacity:0;
  max-width:34ch;
}
.m-name{font-size:1.55em;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
.m-rule{height:1px;background:rgba(255,255,255,.26);margin:.5rem 0}
.m-rows{display:grid;grid-template-columns:auto 1fr;gap:.1rem .95rem}
.m-rows dt{color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.18em}
.m-rows dd{color:#FFFFFF}
.m-rows a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.28);padding-bottom:.05rem}
.m-rows a:hover{border-color:#FFFFFF}
.m-foot{color:rgba(255,255,255,.45);letter-spacing:.18em;text-transform:uppercase}

.hanko{
  position:absolute;right:clamp(1.2rem,4vw,3.4rem);bottom:36%;
  font-family:var(--mono);
  line-height:.9;letter-spacing:0;white-space:pre;
  color:#FFFFFF;
  text-shadow:0 0 6px rgba(4,6,14,.45);
  opacity:0;user-select:none;pointer-events:none;
  will-change:transform;
}
/* The 36% above is not decoration: the script solves for the seal's
   width from it, so the anchor and the arithmetic have to agree.
   There used to be a rule here moving it to 38% below 900px, which
   quietly put the seal higher than the maths believed it was. */

/* ── the seal's card: white, stamped-on-paper ── */
/* The seal's exit rides on this wrapper, never on the seal itself.
   The seal's own transform is written continuously by the fall — its
   position depends on measurements taken at load — so putting a
   second animation on the same element means two things fighting over
   one transform, and whichever wrote last wins. A wrapper keeps them
   apart: the fall owns the seal, the scroll owns the veil. */
.hanko-veil{position:absolute;inset:0;pointer-events:none;
  transform-origin:70% 60%;will-change:transform,opacity}
/* set by the seal itself when the room left under the writing is too
   small to be worth filling */
.hanko-veil.cramped{display:none}
.hanko-veil > .hanko{pointer-events:none}
.hanko-veil > .hanko.ready{pointer-events:auto}

.hanko{cursor:default}
.hanko.ready{pointer-events:auto;cursor:pointer}
.hanko.hot{text-shadow:0 0 12px rgba(255,255,255,.4),0 0 6px rgba(4,6,14,.5)}

.seal-card{
  position:absolute;z-index:6;
  right:calc(clamp(1.2rem,4vw,3.4rem) + min(300px,38vw) + 1.9rem);
  bottom:36%;width:min(290px,40vw);
  background:#FFFFFF;color:#17171A;
  padding:1.15rem 1.2rem 1.05rem;
  box-shadow:0 22px 55px -24px rgba(0,0,0,.65);
  opacity:0;visibility:hidden;transform:translateY(7px);
  transition:opacity .28s ease,transform .28s ease,visibility .28s;
}
.seal-card.on{opacity:1;visibility:visible;transform:translateY(0)}

.seal-card .head{display:flex;gap:.9rem;align-items:flex-start}
.seal-card img{width:62px;height:auto;display:block;flex:none}
.seal-card .kanji{font-family:var(--display);font-size:1.55rem;line-height:1.15;letter-spacing:.06em}
.seal-card .read{color:#8A8880;margin-top:.32rem;font-size:.66rem;letter-spacing:.15em}
.seal-card hr{border:0;border-top:1px solid rgba(23,23,26,.13);margin:.95rem 0 .8rem}
.seal-card .spec{
  display:grid;grid-template-columns:auto 1fr;
  gap:.5rem 1.15rem;font-size:.58rem;letter-spacing:.17em;
}
.seal-card .spec dt{color:#9A988F}
.seal-card .spec dd{color:#17171A}
.seal-card .spec i{font-family:var(--display);font-style:normal;letter-spacing:.05em;font-size:1.15em}
.seal-card a{
  text-decoration:none;
  border-bottom:1px solid rgba(23,23,26,.32);padding-bottom:.16rem;
  transition:border-color .2s,opacity .2s;
}
.seal-card a:hover{border-color:#17171A;opacity:.6}




/* ─────────────────────────────────────────────
   THE INDEX — the whole portfolio, in a column

   Every project is one line: a number, a title, and a rule. Resting
   on a line opens it just enough to say what the thing is and what
   it took, which is as much as anyone wants before deciding whether
   to read further. The full write-up is one click away in the sheet.

   The rows expand in place rather than into a fixed panel, because a
   panel means your eye has to travel; here the answer appears where
   you are already looking.
   ───────────────────────────────────────────── */
/* Code on one side, Japan on the other, so the whole portfolio is
   one glance rather than one scroll. They fall back to a single
   column when there is not room for two. */
.index{
  display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(1.1rem,2.4vw,2.2rem);
  align-items:start;
  /* the only thing on the page that scrolls */
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  /* The browser re-anchors a scroll box when the content inside it
     changes, and the ink script restyles entries on every scroll. The
     two fight, and the result is a list that will not return the last
     few pixels to the top: the section headings stay half cut off.
     This turns the compensation off and lets the number we set be
     the number that sticks. */
  overflow-anchor:none;
  /* Enough empty space under the list that the final project can be
     scrolled up to the middle of the screen rather than stopping at
     the bottom edge, which leaves the last thing you read sitting in
     the most awkward part of the sky. */
  /* a few pixels of buffer above the first heading, so even if the
     browser shaves the last of the scroll the titles stay whole */
  padding:12px 1.5rem calc(var(--tail,46) * 1svh) 0;
  scroll-padding-top:12px;
  /* The browser's own bar is hidden. In its place is a mark that
     floats beside the column: a thin bar with nothing behind it, and
     a small chevron above it while there is still something below.
     It says the list continues; it is not a control. */
  scrollbar-width:none;
}
.index::-webkit-scrollbar{width:0;height:0}

.column{position:relative;flex:1;min-height:0;display:flex}
.mark{
  opacity:0;                      /* the arrival animation brings it in */
  position:absolute;top:12px;bottom:calc(var(--tail,46) * 1svh * .06 + 4px);
  right:0;width:9px;pointer-events:none;
}
.mark i{
  position:absolute;left:3px;width:2px;border-radius:99px;
  background:rgba(255,255,255,.42);
  transition:background .2s ease;
}
/* a marker, not a prompt: it sits still at the head of the rail */
.mark-tip{
  position:absolute;top:-9px;left:-1px;width:10px;height:6px;
  color:rgba(255,255,255,.42);
}
/* when there is nothing to scroll there is nothing to mark */
.mark.idle{visibility:hidden}

.ix-group{--accent:#A8BDE4}
.ix-group[data-accent="shu"]{--accent:#F0A79A}

.ix-head{
  display:flex;align-items:baseline;gap:.7rem;
  margin-bottom:.3rem;color:var(--accent);
}
.ix-head b{font-weight:400;font-size:1.05rem;letter-spacing:.22em}
/* Soft rather than faint: side by side the heading carries the whole
   weight of saying which half you are in, and at .34 it did not. */
.ix-head span{color:var(--ink-soft);letter-spacing:.14em}

/* Every entry is open. A hairline runs down the side of each column
   like a timeline, with a node beside each project, so the two
   columns read as two tracks rather than as two lists of shut
   drawers. Clicking a node still opens the full write-up.

   Nothing is white out here any more: twelve white panels would have
   drowned the page. White is kept for the sheet, where the long read
   happens. */
/* ── ink that follows the sky ─────────────────────────────────
   The sky goes from night at the top to daylight at the foot, so no
   single ink can work everywhere. Rather than darken the background
   under the words, the words take the colour that suits wherever
   they happen to be: pale near the top, near-black once they reach
   the light. Every entry carries its own set of colours, written
   from its position on screen as it scrolls, so the change is
   continuous rather than a line the design snaps across.

   The timeline is drawn as one segment per entry rather than as a
   single rule down the column, which is what lets the line change
   ink with the words instead of staying one colour through both. */
/* The list is inset by a few pixels so the nodes, which straddle the
   line, are not sliced in half by the scroll container: overflow-y
   also clips horizontally, and the circle reaches past the column's
   left edge. */
.ix-list{list-style:none;position:relative;padding-left:5px}
.ix-list li{
  position:relative;padding:0 0 1.15rem 1.5rem;
  /* one quiet colour the whole way down; only the words change ink */
  border-left:1px solid var(--hair);
}
.ix-list li:last-child{padding-bottom:.2rem}

/* the node on the line */
/* A ring, not a dot: hollow, so whatever the sky is doing behind it
   simply shows through, and the only colour it carries is the
   section's own. Nothing about it has to know where it is. */
/* Placed by a fixed offset rather than by a percentage translate.
   A 9px box, border included, has a half of 4.5px, and a percentage
   translate resolves that against the box as it is at the time: when
   the ring grows on hover the browser rounds the offset differently,
   so the ring appeared to sit on the line only while it was large
   and slip off it once it shrank back. A margin in pixels is the
   same number at every size, and scale grows the ring about its own
   centre, so it stays on the line throughout. */
.ix-list li::before{
  content:'';position:absolute;left:0;top:.62em;
  width:9px;height:9px;box-sizing:border-box;
  margin-left:-4.5px;margin-top:-4.5px;
  background:transparent;
  border:1px solid var(--accent);border-radius:50%;
  transition:background .2s ease, scale .2s ease;
}
.ix-list li:hover::before,
.ix-list li:focus-within::before{background:var(--accent);scale:1.25}
.ix-list li.is-open::before{background:var(--accent);scale:1.4}

.ix-row{
  width:100%;display:block;text-align:left;
  background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;
}
.ix-line{display:flex;align-items:baseline;gap:.7rem;padding:0 0 .3rem}
.ix-num{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.15em;
  color:var(--faint-now, var(--ink-faint));flex:none;
}
.ix-name{
  font-family:var(--display);font-weight:400;
  font-size:clamp(1.14rem,1.75vw,1.36rem);line-height:1.32;
  color:var(--ink-now, var(--ink));flex:1;min-width:0;
}
.ix-go{
  font-family:var(--mono);font-size:.69rem;letter-spacing:.14em;
  /* A resting state, not nothing. At zero the only thing saying a row
     can be opened appeared after you had already pointed at it, which
     is late for a hint. Half opacity reads as available without
     competing with the title it sits beside. */
  color:var(--accent-now, var(--accent));opacity:.5;flex:none;transition:opacity .2s ease;
}
.ix-lede{
  display:block;font-size:.99rem;line-height:1.64;
  color:var(--soft-now, var(--ink-soft));max-width:52ch;
}
.ix-tags{display:flex;flex-wrap:wrap;gap:5px;list-style:none;margin-top:.5rem}
/* A chip rather than bare type: a translucent grey that sits
   correctly on both the night and the daylight, so a tag needs no
   help from a shadow or a backdrop to be legible. */
.ix-tags li{
  font-family:var(--mono);font-size:.73rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--soft-now, var(--ink-soft));
  padding:.26rem .5rem;
  background:rgba(124,128,144,.2);
  border:1px solid rgba(124,128,144,.58);
  text-shadow:none;
}
.ix-tags li::before{content:none}          /* tags are not nodes on the line */

/* ── ink by the line, not by the block ────────────────────────
   The boundary is a line drawn across the screen, so a title or a
   summary lying across it wants pale ink on the lines above and dark
   ink on the lines below, inside the one paragraph. A hard-stop
   gradient clipped to the glyphs does that without splitting the text
   into spans: the colour stops being a property of an element and
   becomes a property of where a word happens to sit, which is what
   makes it survive a rewrap, a resize and a change of language on its
   own account.

   Guarded, and the class is written by the ink script, so a browser
   without background-clip gets the per-block switch rather than a
   column of invisible text. */
@supports ((background-clip:text) or (-webkit-background-clip:text)){
  .ix-name.split, .ix-lede.split{
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  /* the hover and open states paint colour, which a transparent fill
     would otherwise swallow */
  .ix-row:hover .ix-name.split,
  .ix-row:focus-visible .ix-name.split,
  .ix-row.open .ix-name.split{-webkit-text-fill-color:var(--hot-now,#FFFFFF)}
  .ix-row:hover .ix-lede.split,
  .ix-row:focus-visible .ix-lede.split{-webkit-text-fill-color:var(--ink-now,var(--ink))}
}

.ix-row:hover .ix-name,
.ix-row:focus-visible .ix-name,
.ix-row.open .ix-name{color:var(--hot-now,#FFFFFF)}
.ix-row:hover .ix-num,
.ix-row:focus-visible .ix-num,
.ix-row.open .ix-num{color:var(--accent-now, var(--accent))}
.ix-row:hover .ix-go,
.ix-row:focus-visible .ix-go,
.ix-row.open .ix-go{opacity:1}
/* Where the pointer cannot hover there is no arrival to reward, so the
   label is simply shown. This asks about the primary input rather than
   about touch support: a laptop with both a trackpad and a touchscreen
   reports hover and keeps the quieter resting state, which is right,
   because it has a cursor. */
@media (hover: none){
  .ix-go{opacity:1}
}
.ix-row:hover .ix-lede,
.ix-row:focus-visible .ix-lede{color:var(--ink-now, var(--ink))}

/* ── the opened card ──────────────────────────────────────────
   An entry that has been clicked expands into a wide white sheet in
   the middle of the screen: the picture small in the top-left with
   the title beside it, and the write-up below, scrolling on its own.

   Rounded corners here are a deliberate exception to the sharp ones
   everywhere else. This is the one surface meant to feel calm and
   readable rather than architectural, and it is white on a dark
   page, so it reads as a different kind of object entirely. */
.sheet{
  /* Fixed rather than absolute: it belongs to the page, not to any
     one part of it, and it should sit still if the page scrolls. */
  position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:900;
  /* Height is capped by the screen and by nothing else. A fixed
     ceiling in rem scrolled cards that had room to sit open: 46rem
     is 736px, which is less than 88% of any viewport taller than
     836px, so on most desks the cap bound rather than the screen.
     Short cards still shrink to their content; this is max-height,
     not height. */
  width:min(55rem,90vw);max-height:88%;
  display:flex;flex-direction:column;
  background:#FBFAF8;color:#14161C;border-radius:14px;
  box-shadow:0 30px 70px rgba(0,0,0,.45);
  opacity:0;scale:.965;pointer-events:none;
  transition:opacity .28s ease, scale .28s cubic-bezier(.2,.8,.3,1);
}
.sheet.on{opacity:1;scale:1;pointer-events:auto}

.sheet-head{
  display:flex;align-items:flex-start;gap:1.3rem;
  padding:1.6rem 1.8rem 1.15rem;flex:none;
}
.sheet-thumb{
  flex:none;width:106px;height:106px;border-radius:10px;
  background-size:cover;background-position:center;background-color:#E4E1DA;
}
.sheet-titles{flex:1;min-width:0;padding-top:.15rem}
.sheet-index{
  font-family:var(--mono);font-size:.76rem;letter-spacing:.2em;
  text-transform:uppercase;color:#8A8578;margin-bottom:.55rem;
}
.sheet h3{
  font-family:var(--display);font-weight:400;
  font-size:clamp(1.55rem,3vw,2.2rem);line-height:1.18;
}
.sheet-close{
  flex:none;width:30px;height:30px;border:0;border-radius:50%;
  background:#EDEAE3;color:#14161C;cursor:pointer;
  font:inherit;font-size:1rem;line-height:1;
}
.sheet-close:hover{background:#DBD6CB}

/* what it taught, as a row of small hard-edged chips */
.sheet-tags{
  flex:none;display:flex;flex-wrap:wrap;gap:8px;
  padding:0 1.8rem 1.15rem;list-style:none;
}
.sheet-tags:empty{display:none}
.sheet-tags li{
  font-family:var(--mono);font-size:.78rem;letter-spacing:.11em;
  text-transform:uppercase;
  padding:.5rem .78rem;
  background:#ECE8DF;color:#3F4350;
  border-left:3px solid var(--accent);
}

/* the repository, for anyone who would rather check than take it on
   trust; it sits with the tags so it survives the scroll */
.sheet-repo{
  flex:none;display:none;align-items:center;gap:.45rem;
  margin:0 1.8rem 1.15rem;padding-bottom:.3rem;width:fit-content;
  font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;
  color:#3F4350;text-decoration:none;
  border-bottom:1px solid rgba(22,24,29,.28);
}
.sheet-repo.on{display:inline-flex}
.sheet-repo:hover{color:var(--shu);border-bottom-color:var(--shu)}

/* the only scrolling part */
.sheet-body{
  overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(20,22,28,.42) rgba(20,22,28,.09);
  padding:0 1.8rem 1.6rem;
  font-size:1.04rem;line-height:1.72;color:#3C3F49;
}
.sheet-body p + p{margin-top:1.05rem}
/* A picture set into the running text. The hairline matters: a scan
   with pale margins would otherwise bleed into the paper behind it. */
.sheet-mid{
  display:block;width:100%;height:auto;margin:1.15rem 0;
  border-radius:10px;background:#E4E1DA;
  box-shadow:0 0 0 1px rgba(20,22,28,.07);
}
/* the same hairline as the index, in the dark it needs on paper */
.sheet-body::-webkit-scrollbar{width:3px}
.sheet-body::-webkit-scrollbar-track{background:rgba(20,22,28,.09);border-radius:99px}
.sheet-body::-webkit-scrollbar-thumb{background:rgba(20,22,28,.42);border-radius:99px}
.sheet-body::-webkit-scrollbar-thumb:hover{background:rgba(20,22,28,.66)}

/* Contact sits in the top right, opposite the business card. At the
   foot of the page this sky has gone pale, and pale text on it all
   but vanished; up here the background is nearly black. */
.contact{
  grid-column:2;grid-row:1;justify-self:end;align-self:start;text-align:right;
  display:flex;flex-direction:column;align-items:flex-end;gap:.55rem;
  color:var(--soft-now,var(--ink-soft));
}
.contact .eyebrow{color:var(--faint-now,rgba(233,231,225,.62));letter-spacing:.19em}
.contact-links{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem}
.contact-links a{
  font-family:var(--mono);font-size:.84rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--hot-now,#FFFFFF);text-decoration:none;
  border-bottom:1px solid var(--faint-now,rgba(255,255,255,.26));padding-bottom:.08rem;
}
.contact-links a:hover{border-color:var(--hot-now,#FFFFFF)}
.contact .colophon{color:var(--faint-now,rgba(233,231,225,.55));letter-spacing:.13em}

/* 900: the page is now one column of writing. Contact comes down out
   of the top right, the index stops pretending it has room for two
   tracks, and the two halves get the border that says so. These used
   to be three separate widths, which meant a band where the halves
   were stacked but nothing marked the join. */
@media (max-width:900px){
  .contact{grid-column:1;grid-row:auto;justify-self:start;text-align:left;
    align-items:flex-start}
  .contact-links{align-items:flex-start}

  .index{grid-template-columns:1fr}

  /* Side by side, which half you are reading is never in question.
     Stacked, they run together, and three entries into Japan the
     heading is long gone. The second group therefore gets a real
     border: space, a line in the colour of the section it introduces,
     and a heading with enough weight to stop the eye. */
  .ix-group + .ix-group{
    margin-top:3rem;padding-top:2.2rem;
    border-top:1px solid var(--accent);
  }
  .ix-head{display:block;margin-bottom:1.1rem}
  .ix-head b{display:block;font-size:1.45rem;letter-spacing:.2em;line-height:1.2}
  .ix-head span{display:block;margin-top:.45rem;font-size:.72rem}
}

/* The contact button. Hidden on a desk, where contact is already in
   the top right as text and needs no announcing. Sharp corners and a
   hairline, so it reads as part of the spec sheet rather than as a
   piece of interface dropped on top of it. */
.contact-btn{
  display:none;position:absolute;z-index:20;
  top:clamp(1.3rem,3.4vh,2rem);right:clamp(1.15rem,5vw,1.8rem);
  background:transparent;color:#FFFFFF;
  border:1px solid rgba(255,255,255,.34);
  padding:.62rem .9rem;cursor:pointer;
  font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  transition:border-color .2s ease,background .2s ease;
}
.contact-btn:active{background:rgba(255,255,255,.1);border-color:#FFFFFF}

/* A ruler for finding breakpoints by eye. Off unless the address ends
   in ?dev, so it costs the real site nothing and never needs removing
   again. Drag the window, watch the number, read off the width where
   a thing starts getting in the way. */
.ruler{
  display:none;position:fixed;left:8px;top:8px;z-index:99;
  background:#0B0C10;color:#FFFFFF;padding:.4rem .55rem;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;
  pointer-events:none;
}
body.dev .ruler{display:block}

/* contact inside the sheet: the links are the content, so they get
   room to be tapped rather than being a line of small print */
.sheet-body .c-link{
  display:block;font-family:var(--mono);font-size:1rem;letter-spacing:.06em;
  color:#17171A;text-decoration:none;
  border-bottom:1px solid rgba(23,23,26,.18);
  padding:.85rem 0;
}
.sheet-body .c-link:last-of-type{border-bottom:0}
.sheet-body .c-link b{font-weight:400;color:rgba(23,23,26,.45);
  display:block;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  margin-bottom:.2rem}

/* The language switch. Black on purpose: it sits at the foot of the
   page, which is where this sky turns to daylight, and a dark block
   is the one thing guaranteed to hold its edges against it. */
.lang{
  position:fixed;right:clamp(1.6rem,4.5vw,3.4rem);
  bottom:clamp(1.4rem,3.4vh,2.4rem);z-index:40;
  display:inline-flex;align-items:center;gap:.5rem;
  background:#0B0C10;color:rgba(255,255,255,.5);
  border:0;padding:.6rem .95rem;cursor:pointer;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;
  box-shadow:0 10px 26px rgba(0,0,0,.34);
  transition:background .25s ease;
}
.lang:hover{background:#15171E}
.lang i{font-style:normal;color:rgba(255,255,255,.24)}
.lang span{transition:color .2s ease}
.lang span.on{color:#FFFFFF}

/* ─────────────────────────────────────────────
   RESPONSIVE
   ───────────────────────────────────────────── */
/* Two different pages, not one page squeezed.

   On a desk the seal is the second half of the composition: it has
   the right of the screen to itself and the text keeps to the left.
   A phone has no right-hand side to give away. Rather than shrink
   that arrangement until both halves are cramped, the seal steps
   back and becomes the ground the writing sits on: still there,
   still the same object, but at a size and weight that lets the
   words be the thing you read. It also stops taking taps, since on
   a touch screen it would otherwise sit under the list. */
/* Three widths, and no others. Every rule below belongs to one of
   them, and each one is a single decision rather than a tweak:

     1070   the seal steps back      measured, where the writing
                                     reaches it
      900   the page becomes one     contact leaves the top right,
            column of writing        the index stops being two
                                     columns, the halves get a border
      700   the page becomes a       the page scrolls instead of the
            phone                    column, the seal goes, contact
                                     gains a button

   There were five before, and the two extra ones each split a single
   idea across two widths: the index used to stack 80px after contact
   moved, and the divider announcing that stack arrived 120px later
   still, which left a band where the two halves ran together with
   nothing between them. Anything that wants a fourth width is
   probably a rule that belongs in one of these three. */

/* 1070px is where the column of writing reaches the seal. Measured by
   dragging the window with ?dev on the address, not guessed.

   Above it the seal is the right half of the composition. Below it
   there is no right half left to give, so it stops being an object in
   the layout and becomes ground: faint enough to read as texture
   behind the words rather than as a thing competing with them. It
   also stops answering the cursor here, because a card unfolding out
   of the background while you are reading is worse than no card. */
@media (max-width:1070px){
  .hanko-veil{opacity:.1 !important}
  .hanko, .hanko.ready, .hanko-veil > .hanko.ready{
    pointer-events:none !important;cursor:default !important;
  }
  .seal-card{display:none !important}
}

@media (max-width:700px){
  /* A scroll region inside a locked screen is miserable on touch, so
     a phone goes back to scrolling the page. The ink still follows
     the sky; it simply follows it as the whole page moves. */
  .hero{height:auto;min-height:100svh;overflow:visible;
    grid-template-columns:1fr;
    padding:clamp(1.3rem,3.4vh,2rem) clamp(1.15rem,5vw,1.8rem) 5.5rem;
    gap:1.5rem;
  }
  /* the card, the list, then the contact: one column, in reading order */
  .hero-left{gap:1.5rem}
  .contact{
    grid-column:1;grid-row:auto;justify-self:stretch;align-self:auto;
    text-align:left;align-items:flex-start;
  }
  .contact-links{flex-direction:row;flex-wrap:wrap;gap:.35rem 1.1rem;align-items:flex-start}

  /* No seal at all on a phone. Between 700 and 1070 it survives as
     faint ground; below that even the ghost is in the way, so it is
     removed outright rather than faded. Nothing to paint and nothing
     to tap, and the JS skips building it entirely. */
  .hanko-veil{display:none}
  .seal-card{display:none}

  /* it already stacked at 900; here it stops being a scroll region */
  .index{gap:1.6rem;overflow:visible;flex:none;padding:0}
  .column{display:block}
  .mark{display:none}
  .hero-left{height:auto}
  .m-name{white-space:normal}
  .lang{right:50%;translate:50% 0;bottom:1.1rem}

  /* the name and role keep the left, the button takes the right */
  .meta{max-width:min(34ch,calc(100% - 8.5rem))}
  .contact-btn{display:block}

  /* the sheet on a hand-held: wider, with a smaller picture, since
     the writing is what anyone opened it for */
  .sheet{width:93vw;max-height:88%}
  .sheet-thumb{width:76px;height:76px}
  .sheet-body{font-size:.98rem}
  /* At 390px the chips ran to five rows and took 28% of the sheet, so
     with the head above them the writing opened in a slot at the
     bottom. The type stays the size it is on a desk; what goes is the
     air around it, which is what was buying the rows. Five rows become
     three, and the writing gets a hundred pixels back. */
  .sheet-tags{gap:5px}
  .sheet-tags li{letter-spacing:.06em;padding:.3rem .5rem;border-left-width:2px}
}

@media (prefers-reduced-motion:reduce){
  .ix-list li::before{transition:none}
  .sheet{transition:none}
}
</style>
</head>

<body>

<div class="sky" aria-hidden="true"></div>

<header class="hero">
  <div class="hero-left">
    <div class="meta" id="meta"></div>

    <!-- the portfolio itself: one line per project, with a floating
         mark beside it rather than a scrollbar -->
    <div class="column">
      <section class="index" id="index"></section>
      <div class="mark" id="mark" aria-hidden="true">
        <svg class="mark-tip" viewBox="0 0 10 6" focusable="false">
          <path d="M5 0 L10 6 L0 6 Z" fill="currentColor"/>
        </svg>
        <i></i>
      </div>
    </div>
  </div>

  <!-- top right: the darkest corner of the sky, and the one place a
       pale link is guaranteed to be readable -->
  <footer class="contact">
    <span class="eyebrow mono" id="contactEyebrow"></span>
    <nav class="contact-links" id="contactLinks"></nav>
    <p class="colophon mono" id="colophon"></p>
  </footer>

  <!-- phones only: the footer is a long way down and nothing announces
       it, so contact also gets a button in the top right, where the
       reader lands. It opens the same sheet a project opens, and the
       footer stays where it is for anyone who scrolls to the end. -->
  <button id="contactBtn" class="contact-btn mono" type="button"></button>

  <!-- only visible with ?dev on the address -->
  <div class="ruler" id="ruler" aria-hidden="true"></div>

  <!-- lang="ja" is deliberate and does not follow the site language.
       Font fallback is language-aware, and the maths glyphs the seal
       is drawn from resolve to a Japanese font here, which is the
       version worth keeping. Pinning it means the seal looks the same
       on both halves of the site instead of changing with the toggle. -->
  <div class="hanko-veil"><pre class="hanko" lang="ja" role="img" aria-label="Personal seal" tabindex="0"></pre></div>
  <aside class="seal-card" id="sealCard">
    <div class="head">
      <img id="sealCardImg" alt="Impression of the seal">
      <div>
        <div class="kanji">雅舞</div>

    </div>
    <hr>
    <dl class="spec mono">
      <dt>Carver</dt>
      <dd><i>雨人</i> / Ujin</dd>
      <dt>Place</dt>
      <dd><a href="https://maps.app.goo.gl/KLBwy6aoJ7CvqgKUA" target="_blank" rel="noopener">Kita-Kamakura ↗</a></dd>
    </dl>
  </aside>
</header>

<!-- language, bottom left: black, because the sky has gone pale by
     the time it reaches the foot of the page -->
<button id="lang" class="lang mono" type="button">
  <span data-l="en">EN</span><i>/</i><span data-l="ja">日本語</span>
</button>

<!-- the full write-up, one per page rather than one per section -->
<div class="sheet" role="dialog" aria-modal="false">
  <div class="sheet-head">
    <span class="sheet-thumb"></span>
    <span class="sheet-titles">
      <span class="sheet-index mono"></span>
      <h3></h3>
    </span>
    <button class="sheet-close" aria-label="Close">×</button>
  </div>
  <ul class="sheet-tags"></ul>
  <a class="sheet-repo mono" target="_blank" rel="noopener noreferrer"></a>
  <div class="sheet-body"></div>
</div>

          mid:'photos/adversarial-example.webp',

          body:`Three ways to fool an image classifier, measured on how much accuracy they destroy, how visible the damage is, and whether it carries to a network they were not built for. An adversarial attack shifts an image by amounts too small for a person to see, and the model reading it returns the wrong label. The same trick can keep an artist's work out of a training set, or make a road sign unreadable to a car.

The result worth knowing is that imperceptibility and transferability trade off against one another. C&W stays under the just-noticeable threshold at every perturbation budget tested, and it is precisely the attack that fails to transfer: examples crafted on ResNet-50 barely move VGG-16. FGSM, the crudest of the three, crosses architectures with ease. So defending an image against a model you cannot inspect is harder than any single number suggests.

I implemented the three attacks behind a shared base class and added two metrics of my own, because top-1 accuracy hides too much: one that tracks confidence in the true class rather than only whether the prediction flipped, and one that scores accuracy lost per unit of L₂ distortion spent. Both networks were then swept across the full 13,500-image test set as batch jobs on DTU's HPC cluster, with 95% confidence intervals on every figure.`,

        { title:'Melanoma Classification from Skin Photographs',

          repo:'https://github.com/MrSejr/melanoma-cnn',

                'Recall vs specificity','Medical imaging','CUDA training'],
          body:`Building and training a convolutional network from scratch to sort photographs of skin lesions into benign and malignant, then measuring it against the published performance of dermatologists on the same task. The two mistakes do not cost the same. A false alarm costs a clinic visit; a miss costs more than that, and the work was aimed squarely at the second one.

The dataset turned out to be the lever. With 46,600 benign images against 7,100 malignant, a network scored on accuracy learns that guessing benign is nearly always safe, which is how you get a model that looks excellent and is not. Retrained on a balanced subset, it finds 90.6% of melanomas for the cost of about one point of accuracy. Choosing that version is a judgement about which error you can live with, not an exercise in maximising a number.

The architecture is two convolutional blocks feeding fully connected layers, trained with Adam and binary cross-entropy over 100 epochs and evaluated through confusion matrices with confidence intervals. Moving training onto the GPU cut the time by a factor of fifteen, which is what made a real hyperparameter search possible. The data is roughly 53,700 clinician-labelled images merged from three public sources.`,

        { title:'KAIWA-LOG',

                'Anthropic API (caching, batching)','fugashi / UniDic','Local-first design'],
          body:`A local pipeline that turns a recording of a real Japanese conversation into a verified transcript, a personal language database and one round of written feedback. It transcribes, separates the speakers, asks you to confirm the parts the machine was unsure of, and tracks how much of your Japanese is still shaped by Danish or English. The point is to see the mistakes you make when nobody is marking you.

The design problem is trust rather than accuracy. Speech recognition on Japanese is confident and wrong often enough that feeding it straight into a learning record would quietly teach you your own errors, so uncertain words and known failure patterns send an utterance through a fast human confirm-or-correct loop before it is allowed into the database.

Everything lands as rows in SQLite and every report is a disposable view over it, which keeps the data worth more than the tool. One API call per session, with caching and a batch mode to keep it cheap. The Japanese-specific logic sits in four places on purpose, so pointing the same pipeline at another language means replacing those and nothing else.`,

/* ── the ruler ──────────────────────────────────────────────────
   Add ?dev to the address and the viewport size is printed in the
   top left corner while you drag the window. It is how the numbers
   in the media queries below were chosen, and how to change them:
   find the width where something starts getting in the way, then
   put that width in the query. Nothing runs unless you ask for it.
   ──────────────────────────────────────────────────────────────── */
if (/(^|[?&])dev(=|&|$)/.test(location.search)) {
  document.body.classList.add('dev');
  const ruler = document.getElementById('ruler');
  const tick  = () => { ruler.textContent = innerWidth + ' × ' + innerHeight; };
  addEventListener('resize', tick, { passive:true });
  tick();
}

五学期のあいだに延べ百人以上が出入りし、2026 年秋学期は初週に新しいメンバーが十三人加わった。週一回の集まりのほかに、コペンハーゲン以外のデンマークへの遠足、バーベキュー、茶会、それぞれが自分の台所を持ち寄る料理の会などをやっている。

二年半で何より学んだのは、人に会いたいと思うことと実際に何かを始めることはまったく別の行為で、多くの人は前者で止まるということだ。集まりの中の沈黙は関心がないのではなく、誰も最初の一歩を踏み出していないだけである。日程を提案し、場所を押さえ、連絡を出す。その役目がこの仕事のほとんどで、集まりが続くのは誰かがそれをやり続けているからだ。`

          body:`2026 年 2 月、秋田・男鹿のなまはげ柴灯まつりに、面と藁の装束を着けて参加した。きっかけはボランティアだった。男鹿に長く暮らした経験のあるデンマーク人が、コペンハーゲンの桜まつりのボランティアに向けて、デンマークの東海大学ヨーロッパ学術センターで一緒になまはげをやる人はいないかと声をかけた。二度は来ない機会だと思って手を挙げた。一年後、秋田でその人を知る人たちと居合わせ、話しているうちに、まつり本番にデンマーク人のなまはげ隊を組むことになった。

準備は地元の学校で行った。動きの硬さをほぐし、役を保てるだけの秋田弁を覚え、あの唸り声を習う。いちばん良かったのは、教わる必要などまったくない様子で、すでにこの神を完璧に体現している地元の子どもたちを見たことだった。

着いたときの日本語は紙の上だけのものだった。帰るころには、英語から訳すのではなく日本語で考えていた。語彙は少ないままだったが、あいだの一段はなくなっていた。`

そして、このページに載っている他のほとんどはここから始まっている。ホームステイ先を紹介してくれた人もここにいたし、のちに秋田のなまはげ隊に誘ってくれた人もここにいた。終了後のレセプションでは日本の大使にも会った。どれもボランティアをした理由ではない。そこが肝心で、日本で関わった大きな二つの出来事は、どちらも小さな手伝いに顔を出したことから始まっている。`

          body:`2023 年春にボーセイ・フォルケホイスコーレに入り、その後 2025 年から 2026 年の冬学期に東海大学へ留学した。ボーセイはギャップイヤーの選択で、単なる好奇心と、何か変化がほしいという気持ちから決めた。日本人との最初の友人関係はそこで生まれている。東海大学はデンマークに深い根を持ち、ボーセイとも長い友好関係にあるので、そこへ行くのは国を無作為に選ぶことではなく、同じ線をたどることだった。

/* Everything below is rendered from whichever language is active, and
   re-rendered when it changes. Nothing is translated in place; the
   page is simply built again from the other content. */
let LANG = location.hash === '#ja' ? 'ja' : 'en';

/* Japanese where it exists, English where it does not, at any depth.
   Arrays merge element by element, so a section can be translated
   without listing the projects it contains, and a project can be
   translated without listing its tags. */
function localise(en, ja){
  if (ja === undefined || ja === null) return en;
  if (Array.isArray(en))
    return en.map((v, i) => localise(v, Array.isArray(ja) ? ja[i] : undefined));
  if (en && typeof en === 'object'){
    const out = {};
    for (const k in en) out[k] = localise(en[k], ja[k]);
    return out;
  }
  return (typeof ja === 'string' && ja.length) ? ja : en;
}
const active = () => LANG === 'ja' ? localise(CONTENT, JA) : CONTENT;
const ui = () => LANG === 'ja' ? JA.ui : { read:'Read ↗', close:'Close' };

const lede = body => String(body).trim().split(/\n\s*\n/)[0]
  .split(/(?<=[.。])\s*/)[0].trim();

function render(){
  const C = active();
  document.documentElement.lang = LANG;

  meta.innerHTML =
    `<div class="m-name">${C.hero.name}</div>
     <div class="m-rule"></div>
     <dl class="m-rows">${C.hero.rows
        .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
     ${C.hero.foot ? `<div class="m-rule"></div>
     <div class="m-foot">${C.hero.foot}</div>` : ''}`;

  document.getElementById('index').innerHTML = C.sections.map((sec, si) => `
    <div class="ix-group" data-accent="${sec.accent}">
      <div class="ix-head mono"><b>${sec.rail}</b><span>${sec.label}</span></div>
      <ul class="ix-list">
        ${sec.cards.map((c, ci) => `
          <li><button class="ix-row" data-s="${si}" data-c="${ci}">
            <span class="ix-line">
              <span class="ix-num">${pad(ci + 1)}</span>
              <span class="ix-name">${c.title}</span>
              <span class="ix-go mono">${ui().read}</span>
            </span>
            <span class="ix-lede">${lede(c.body)}</span>
            ${c.tags ? `<ul class="ix-tags">${c.tags.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
          </button></li>`).join('')}
      </ul>
    </div>`).join('');

  contactEyebrow.textContent = C.contact.eyebrow;
  colophon.textContent       = C.contact.colophon;
  contactBtn.textContent     = C.contact.eyebrow;
  /* mail and tel stay in the page; anything else is somewhere else,
     and opens there rather than taking the portfolio with it */
  contactLinks.innerHTML = C.contact.links.map(l => {
    const away = /^https?:/i.test(l.href);
    return `<a href="${l.href}"${away ? ' target="_blank" rel="noopener noreferrer"' : ''}>${l.label}</a>`;
  }).join('');
}
render();

6Xb/rd/2u3/X/7fo/z8kxUuPThh8AAAAASUVORK5CYII=';
const SEAL = (() => {
  const el  = document.querySelector('.hanko');
  const cvs = document.createElement('canvas');
  const ctx = cvs.getContext('2d', { willReadFrequently:true });
  const img = new Image();
  const SRC = 'data:image/png;base64,' + B64;

  /* A phone never shows the seal, so it never builds one. Sampling
     the image, laying out tens of thousands of glyphs and running the
     fall would all be paid for on the slowest device and then hidden
     by CSS. The stub keeps the same shape so nothing downstream has
     to know. */
  if (matchMedia('(max-width:700px)').matches){
    document.body.classList.add('seal-ready');
    return { stop(){}, idle(){}, agitate(){}, SRC };
  }

  /* four densities — a cell re-rolls inside its own tier, so the
     texture shimmers without the shape wobbling */
  const TIERS = [
    [],
    ['·','-','+','~','^'],
    ['×','÷','±','=','≠'],
    ['∑','∏','∫','√','Ω','⊗']
  ];

  /* 160 rather than 220. At 220 the opening frame is a single <pre>
     holding about 35,600 glyphs, and the shimmer relaid out every one
     of them on each beat for the whole first second. 160 is about
     17,900, a little over half the work, and the seal still arrives
     finer than it lands. */
  const STEPS = [160,140,112,90,72,60];
  const LINE_H = 0.9;

  /* The advance is measured, not assumed. It used to be hardcoded at
     0.6em, which is true of a Western monospace and false of a
     Japanese one: ∑ ∏ ∫ √ Ω ⊗ × ÷ ± ≠ are East Asian Ambiguous, so a
     CJK font draws them fullwidth. Since the seal now always renders
     in Japanese, the grid has to be sized from what the browser
     actually does rather than from what the code hoped. Measured once,
     on a throwaway element, never on the seal itself. */
  let CH_W = 0.6, RATIO = CH_W / LINE_H;
  (() => {
    const pool  = TIERS.flat().join('');
    if (!pool) return;
    const probe = document.createElement('span');
    probe.lang = 'ja';
    probe.textContent = pool.repeat(20);
    probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;'
      + 'white-space:pre;letter-spacing:0;font-size:100px;font-family:'
      + getComputedStyle(el).fontFamily;
    document.body.appendChild(probe);
    const em = probe.getBoundingClientRect().width / (pool.length * 20) / 100;
    probe.remove();
    if (em > .2 && em < 1.6){ CH_W = em; RATIO = CH_W / LINE_H; }
  })();

  /* ── the writing keeps its ground ──────────────────────────────
     The seal is sized against the words rather than against a number
     someone picked. CEIL is the lowest edge of anything it must not
     climb into, measured from what the page actually laid out, so it
     is correct in either language and at any text size the reader has
     set. The seal then gets whatever room is left underneath.

     Measured on resize and cached, never per frame: these are two
     small boxes, but reading a rect forces layout, and the fall is
     the one moment in this page that cannot afford it.
     ───────────────────────────────────────────────────────────── */
  const KEEP_OUT = ['.meta', '.contact'];
  const GAP = 26;                     /* clear air below the writing */
  let CEIL = 0;

  function measureCeiling(){
    let low = 0;
    for (const sel of KEEP_OUT){
      const n = document.querySelector(sel);
      if (!n) continue;
      const r = n.getBoundingClientRect();
      if (r.height) low = Math.max(low, r.bottom);
    }
    CEIL = low + GAP;
  }
  measureCeiling();

  /* 344×380, so it stands 1.105 times as tall as it is wide, and its
     base is anchored at bottom:36%. Its top therefore reaches
     0.36·vh + 1.105·w up from the floor, and that has to stay below
     CEIL. Solve for w and it is the third term below. */
  const ASPECT = 1.105;
  const endW = () => Math.max(0, Math.min(
    300,
    innerWidth * 0.38,
    (innerHeight * 0.64 - CEIL) / ASPECT
  ));
  /* the opening is large on purpose, but it keeps its proportion to
     where it is going rather than to the window, so a short screen
     does not get a giant seal for the two seconds of the fall */
  const startW = () => Math.min(innerWidth * 0.9, 1000, endW() * 3.4);
  const widthAt = p => startW() + (endW() - startW()) * p;

  const cache = new Map();
  let chars = null, curCols = 0, natW = 0, natH = 0;

  function sample(cols){
    if (cache.has(cols)) return cache.get(cols);
    const rows = Math.max(1, Math.round(cols * (img.height / img.width) * RATIO));
    cvs.width = cols; cvs.height = rows;
    ctx.clearRect(0, 0, cols, rows);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, cols, rows);
    const d = ctx.getImageData(0, 0, cols, rows).data;
    const tier = new Uint8Array(cols * rows);
    for (let i = 0; i < tier.length; i++){
      const a = d[i * 4 + 3] / 255;
      tier[i] = a < .18 ? 0 : a < .48 ? 1 : a < .78 ? 2 : 3;
    }
    const g = { cols, rows, tier };
    cache.set(cols, g);
    return g;
  }

  const pick = t => TIERS[t][(Math.random() * TIERS[t].length) | 0];

  function paint(cols, churn){
    const g = sample(cols);
    if (cols !== curCols){
      curCols = cols;
      chars = new Array(g.tier.length);
      for (let i = 0; i < chars.length; i++) chars[i] = g.tier[i] ? pick(g.tier[i]) : ' ';
    } else if (churn > 0){
      const n = (chars.length * churn) | 0;
      for (let k = 0; k < n; k++){
        const i = (Math.random() * chars.length) | 0;
        if (g.tier[i]) chars[i] = pick(g.tier[i]);
      }
    }
    let out = '';
    for (let y = 0, i = 0; y < g.rows; y++, i += g.cols)
      out += chars.slice(i, i + g.cols).join('').trimEnd() + '\n';
    el.textContent = out;
  }

  /* lock in a resolution and the font-size that renders it at width w */
  function setStep(cols, w){
    const g  = sample(cols);
    const fs = w / (cols * CH_W);
    el.style.fontSize = fs + 'px';
    paint(cols, 0);
    natW = w;
    natH = g.rows * LINE_H * fs;
  }

  /* Geometry is worked out arithmetically — measuring would force a
     layout of every glyph. The element is anchored bottom-right, so its
     natural centre shifts every time the font-size steps. Tracking that
     each frame is what keeps the fall smooth: without it the centre
     lurches once per step. */
  let R = 0, B = 0;
  const readAnchor = () => {
    const cs = getComputedStyle(el);
    R = parseFloat(cs.right)  || 0;
    B = parseFloat(cs.bottom) || 0;
  };
  const naturalCentre = () => ({
    cx: innerWidth  - R - natW / 2,
    cy: innerHeight - B - natH / 2
  });
  /* where it comes to rest, at its final size */
  function restingCentre(){
    const g  = sample(60);
    const fs = endW() / (60 * CH_W);
    return {
      cx: innerWidth  - R - endW() / 2,
      cy: innerHeight - B - (g.rows * LINE_H * fs) / 2
    };
  }

  function settle(){
    curCols = 0;
    measureCeiling();
    readAnchor();
    setStep(60, endW());
    gsap.set(el, { x:0, y:0, scale:1 });
    /* below this it is a smudge rather than a seal, and a smudge is
       worth less than the space it costs */
    el.parentElement.classList.toggle('cramped', endW() < 118);
  }

  function fall(){
    STEPS.forEach(sample);          /* pre-warm: no sampling mid-fall */
    readAnchor();
    setStep(STEPS[0], startW());
    const rest = restingCentre();
    let step = 0, lastFlick = 0;

    /* one function places the seal for any progress, so the held
       opening pose and the fall itself share the same maths */
    const place = p => {
      const w = widthAt(p);
      const i = Math.min(STEPS.length - 1, Math.floor(Math.pow(p, .55) * STEPS.length));
      if (i !== step){ step = i; setStep(STEPS[i], w); }
      const tx = innerWidth  / 2 + (rest.cx - innerWidth  / 2) * p;
      const ty = innerHeight / 2 + (rest.cy - innerHeight / 2) * p;
      const n  = naturalCentre();
      gsap.set(el, { x: tx - n.cx, y: ty - n.cy, scale: w / natW });
      return i;
    };

    gsap.set(el, { transformOrigin:'50% 50%' });
    place(0);
    gsap.to(el, { opacity:1, duration:.8, ease:'power2.out' });

    /* it hangs there for a beat before falling — shimmering, not frozen */
    let linger = setInterval(() => paint(STEPS[0], .045), 140);

    const st = { p:0 };
    gsap.to(st, {
      p:1, duration:2.1, delay:1, ease:'power2.inOut',
      onStart(){ clearInterval(linger); linger = null; },
      onUpdate(){
        const i = place(st.p);
        const now = performance.now();
        if (STEPS[i] <= 130 && now - lastFlick > 55){
          lastFlick = now;
          paint(STEPS[i], .28 * (1 - st.p) + .015);
        }
      },
      onComplete(){ settle(); idle(); el.classList.add('ready');
                    document.body.classList.add('seal-ready'); }
    });
  }

  let timer = null, churn = .012, beat = 220;
  const idle = () => { stop(); timer = setInterval(() => paint(60, churn), beat); };
  const stop = () => { if (timer) clearInterval(timer), timer = null; };
  /* hovering stirs the symbols up */
  const agitate = on => {
    churn = on ? .17 : .012;
    beat  = on ? 62  : 220;
    if (timer) idle();
  };

  img.onload = () => {
    if (reduced){ settle(); gsap.set(el, { opacity:1 }); el.classList.add('ready');
                  document.body.classList.add('seal-ready'); }
    else fall();
    addEventListener('resize', () => { if (timer) settle(); }, { passive:true });
  };
  img.src = SRC;

  return { stop, idle, agitate, SRC };
})();

/* ── hero: the seal lands, the spec sheet types itself in ── */
if (reduced) {
  gsap.set(['.meta','.index','.mark'], { opacity:1 });
} else {
  /* The seal is thrown at 1s and lands at about 3.1s. The list used
     to arrive at 0.55s, so the two were competing for attention at
     the very moment the seal was falling. It now starts a second
     later and takes longer to come up, so the eye is on the hanko
     while it falls and finds the projects once it has settled. */
  gsap.timeline({ defaults:{ ease:'power3.out' } })
    .fromTo('.meta',  { opacity:0, x:-16 }, { opacity:1, x:0, duration:1 }, .1)
    .fromTo('.contact-btn', { opacity:0 }, { opacity:1, duration:1 }, .1)
    .fromTo(['.index','.mark'], { opacity:0, y:10 }, { opacity:1, y:0, duration:1.6 }, 1.55);

}



/* ── contact ── */
if (!reduced) gsap.from('.contact > *',
  { opacity:0, y:14, duration:.7, stagger:.09, ease:'power2.out', delay:1.5 });

/* ── the sheet ────────────────────────────────────────────────
   The full write-up, opened from a row and closed by the button,
   Escape, or a click anywhere off it. It is the only piece of the
   old stream that survived intact, because it was always the part
   doing the actual work.
   ──────────────────────────────────────────────────────────────── */
(() => {
  const sheet = document.querySelector('.sheet');
  const el = k => sheet.querySelector(k);
  const head = el('h3'), body = el('.sheet-body'), idx = el('.sheet-index'),
        thumb = el('.sheet-thumb'), tags = el('.sheet-tags'), repo = el('.sheet-repo');
  let openRow = null;

  function close(){
    if (!sheet.classList.contains('on')) return;
    sheet.classList.remove('on');
    if (openRow){
      openRow.classList.remove('open');
      openRow.closest('li').classList.remove('is-open');
      openRow.focus({ preventScroll:true });
      openRow = null;
    }
  }

  /* Contact opens in the same sheet a project opens in. On a phone the
     footer is a long scroll away and nothing announces it, so rather
     than repeat the details at the top, the button up there opens
     them here. One copy of the information, two ways in. */
  function openContact(){
    const C = active();
    idx.textContent  = '';
    head.textContent = C.contact.eyebrow;
    thumb.style.background = `url('${SEAL.SRC}') center/contain no-repeat #FFFFFF`;
    tags.innerHTML = '';
    repo.classList.remove('on');
    body.innerHTML = C.contact.links.map(l => {
      const away = /^https?:/i.test(l.href);
      return `<a class="c-link" href="${l.href}"${
        away ? ' target="_blank" rel="noopener noreferrer"' : ''
      }>${l.label}${away ? ' ↗' : ''}</a>`;
    }).join('') + `<p class="colophon mono">${C.contact.colophon}</p>`;
    body.scrollTop = 0;
    if (openRow){
      openRow.classList.remove('open');
      openRow.closest('li').classList.remove('is-open');
      openRow = null;
    }
    sheet.classList.add('on');
    el('.sheet-close').focus({ preventScroll:true });
  }

  document.getElementById('contactBtn').addEventListener('click', e => {
    e.stopPropagation();      /* or the window listener shuts it again */
    openContact();
  });

  function open(row){
    const sec = active().sections[+row.dataset.s];
    const ci  = +row.dataset.c, c = sec.cards[ci];
    idx.textContent  = `${sec.rail} — ${pad(ci + 1)}`;
    head.textContent = c.title;
    thumb.style.background = c.img
      ? `url('${c.img}') center/cover`
      : sec.swatches[ci % sec.swatches.length];
    tags.innerHTML = (c.tags || []).map(t => `<li>${t}</li>`).join('');
    repo.classList.toggle('on', !!c.repo);
    if (c.repo){
      repo.href = c.repo;
      repo.textContent = c.repo.replace(/^https?:\/\//, '').replace(/\/$/, '') + ' ↗';
    }
    const ps = String(c.body).trim().split(/\n\s*\n/)
      .map(p => `<p>${p.trim()}</p>`);
    /* after the opening paragraph, so a card reads as text, picture,
       then the rest, rather than opening on a photograph */
    if (c.mid) ps.splice(1, 0, `<img class="sheet-mid" src="${c.mid}" alt="${c.alt || c.title}">`);
    body.innerHTML = ps.join('');
    body.scrollTop = 0;
    if (openRow){ openRow.classList.remove('open'); openRow.closest('li').classList.remove('is-open'); }
    openRow = row; row.classList.add('open'); row.closest('li').classList.add('is-open');
    sheet.classList.add('on');
    el('.sheet-close').focus({ preventScroll:true });
  }

  document.getElementById('index').addEventListener('click', e => {
    const row = e.target.closest('.ix-row');
    if (!row) return;
    /* the click-away listener below is on the window, so without this
       the very click that opens the sheet also closes it again */
    e.stopPropagation();
    open(row);
  });
  sheet.addEventListener('click', e => e.stopPropagation());
  el('.sheet-close').addEventListener('click', close);
  addEventListener('click', e => { if (!sheet.contains(e.target)) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();

/* ═══════════════════════════════════════════════════════════════
   FEEL — the numbers behind the scroll and the ink

   Smooth scrolling: a notch asks for a little less than it reports
   and the list closes part of the remaining distance each frame, so
   it eases into place rather than landing on it.

   Lower close for a longer, softer glide; raise it toward 1 for the
   hard, immediate jump a browser does by default.
   ═══════════════════════════════════════════════════════════════ */
const FEEL = {
  close : .07,    /* share of the remaining distance covered each frame */
  reach : .95,    /* how much of a wheel notch counts                   */
  lead  : 1.5,    /* how far ahead a fast spin may get, in screens      */
  edge  : .655,   /* where the ink turns over, down the screen          */
  tail  : 52      /* space after the last project, in svh               */
};
document.documentElement.style.setProperty('--tail', FEEL.tail);

/* ── ink that follows the sky ─────────────────────────────────
   The sky is a fixed gradient and the page never scrolls, so a given
   height on screen always has the same colour behind it. That makes
   the right ink for a line of text a pure function of where that
   line currently sits, which is what this works out.

   Colours are written onto each entry as custom properties rather
   than swapped by a class, so the change is a continuous slide
   through the mid tones instead of a flip. Between roughly 44% and
   80% of the screen the sky passes from navy to daylight; that is
   the stretch over which the ink turns over, eased at both ends so
   nothing changes abruptly at the boundary.

   It runs on scroll and on resize, inside a rAF, and touches only
   the entries whose figure actually moved.
   ──────────────────────────────────────────────────────────────── */
(() => {
  const index = document.getElementById('index');
  /* The ledes and the tags were being held back by transparency: at
     66% and 86% they take on whatever is behind them, which on the
     middle of this sky is a mid grey, and the small type went soft
     exactly where it could least afford to. They are solid colours
     now, chosen rather than blended, which lifts the small dark text
     from 3.5:1 to 4.9:1 where the sky is worst and to 12:1 at the
     foot of the page. */
  const LIGHT = {            /* against the night at the top */
    ink:[233,231,225,1], soft:[206,205,199,1], faint:[150,150,146,1],
    hot:[255,255,255,1]
  };
  const DARK = {             /* against the daylight at the foot */
    ink:[18,20,26,1], soft:[28,31,39,1], faint:[74,78,88,1],
    hot:[0,0,0,1]
  };
  const ACCENT = {           /* each section has a light and a dark voice */
    ai:  { lo:[168,189,228], hi:[47,74,128] },
    shu: { lo:[240,167,154], hi:[158,46,38] }
  };

  const rgba = c => `rgba(${c[0]},${c[1]},${c[2]},${(c[3] ?? 1)})`;

  /* Each line turns over on its own account, not with its entry. An
     entry is two or three centimetres tall, so while it crosses the
     line its title can be well above it and its tags well below, and
     switching the whole block at once means one half is always the
     wrong ink. The title, the summary and each tag are measured and
     painted separately; the entry itself is still painted too, since
     the ring on the timeline takes its colour from there.

     The contact block is painted by the same rule as the entries.
     It has to be: on a phone the page scrolls rather than the column,
     so contact ends up at the foot of the screen where this sky has
     turned to daylight, and pale text there is invisible. Nothing new
     is introduced for it, it simply joins the list of things the one
     switch already governs. */
  const rows = () => [
    ...index.querySelectorAll('.ix-list > li'),   /* the node on the line   */
    ...index.querySelectorAll('.ix-line'),        /* the number and title   */
    ...index.querySelectorAll('.ix-lede'),        /* the one-line summary   */
    ...index.querySelectorAll('.ix-tags > li'),   /* every tag on its own   */
    ...document.querySelectorAll('.contact')
  ];
  let entries = [];

  /* The title and the summary are the only two things in the list that
     wrap, so they are painted by the line instead of as a block. The
     rest are one line each and the switch above is already exact for
     them. */
  let splits = [];

  const collect = () => {
    entries = rows().map(li => {
      const g = li.closest('.ix-group');
      return { li, pale:null, accent: ACCENT[g && g.dataset.accent] || ACCENT.ai };
    });
    splits = [...index.querySelectorAll('.ix-name, .ix-lede')].map(el =>
      ({ el, y:null, key: el.classList.contains('ix-lede') ? 'soft' : 'ink' }));
  };

  /* Where the boundary crosses this element, measured from its top and
     snapped to the gap between two of its lines. Left on the raw pixel
     the stop lands halfway up a row of letters and cuts them in half,
     which is the one way this trick looks broken. A Range reports one
     rectangle per line box, which is the only honest source for where
     the lines actually are once the text has wrapped. */
  function stop(el, r, edge){
    if (edge <= r.top)    return 0;
    if (edge >= r.bottom) return r.height;
    const range = document.createRange();
    range.selectNodeContents(el);
    for (const line of range.getClientRects()){
      if (edge > line.top && edge < line.bottom){
        const near = edge - line.top < line.bottom - edge ? line.top : line.bottom;
        return near - r.top;
      }
    }
    return edge - r.top;            /* between two lines already */
  }

  /* One rule, and nothing layered on top of it: an entry is pale
     while it is above the line and near-black once it is below.

     The line is at 65.5% of the screen because that is where the two
     inks are equally strong against this sky, 3.85:1 either way.
     It switches rather than fades, because fading passes through the
     mid greys and the sky is a mid grey exactly there. */
  const F = FEEL;   /* same script scope, not a window property */

  function paint(){
    const h = innerHeight, edge = h * F.edge;
    for (const e of entries){
      const r = e.li.getBoundingClientRect();
      const mid = r.top + Math.min(r.height, 96) / 2;      /* judge by the title */
      const pale = mid < edge;
      if (pale === e.pale) continue;                      /* nothing changed */
      e.pale = pale;

      const P = pale ? LIGHT : DARK;
      const st = e.li.style;
      st.setProperty('--ink-now',   rgba(P.ink));
      st.setProperty('--soft-now',  rgba(P.soft));
      st.setProperty('--faint-now', rgba(P.faint));
      st.setProperty('--hot-now',   rgba(P.hot));
      st.setProperty('--accent-now',rgba(pale ? e.accent.lo : e.accent.hi));
    }

    for (const s of splits){
      const r = s.el.getBoundingClientRect();
      if (!r.height) continue;                          /* not laid out yet */
      const y = Math.round(stop(s.el, r, edge));
      if (y === s.y) continue;                          /* nothing moved */
      s.y = y;
      const up = rgba(LIGHT[s.key]), down = rgba(DARK[s.key]);
      s.el.style.backgroundImage =
        `linear-gradient(to bottom, ${up} 0, ${up} ${y}px, ${down} ${y}px, ${down} 100%)`;
      /* the class is what makes the fill transparent, so it goes on only
         once there is a gradient underneath to show through it */
      s.el.classList.add('split');
    }
  }

  let queued = false;
  const ask = () => { if (queued) return; queued = true;
    requestAnimationFrame(() => { queued = false; paint(); }); };

  index.addEventListener('scroll', ask, { passive:true });
  /* on a phone the column does not scroll, the page does */
  addEventListener('scroll', ask, { passive:true });
  addEventListener('resize', () => { collect(); ask(); }, { passive:true });
  /* the index is rebuilt whenever the language changes */
  window.repaintInk = () => { collect(); paint(); };
  collect(); paint();
})();

/* ── the mark beside the column ───────────────────────────────
   A bar whose length is the share of the list you can see and whose
   position is how far down it you are, drawn with nothing behind it.
   The chevron above it stays while there is more below and fades out
   once you reach the end, which is the only state worth signalling.
   ──────────────────────────────────────────────────────────────── */
(() => {
  const index = document.getElementById('index');
  const mark  = document.getElementById('mark');
  const bar   = mark.querySelector('i');
  const MIN   = 26;                       /* never a dot, however long the list */

  function draw(){
    const view = index.clientHeight, all = index.scrollHeight;
    const room = all - view;
    /* opacity belongs to the arrival animation; visibility is all
       this needs, so the two never write the same property */
    mark.classList.toggle('idle', room < 8);
    if (room < 8) return;

    const rail = mark.clientHeight;
    const len  = Math.max(MIN, Math.round(rail * view / all));
    const at   = Math.round((rail - len) * (index.scrollTop / room));
    bar.style.height = len + 'px';
    bar.style.transform = `translateY(${at}px)`;
  }

  index.addEventListener('scroll', draw, { passive:true });
  addEventListener('resize', draw, { passive:true });
  window.redrawMark = draw;               /* the language switch rebuilds the list */
  draw();
})();

/* ── the wheel belongs to the column ──────────────────────────
   The projects live in their own scroll box, which by default only
   answers a wheel when the pointer is inside it. On a page where two
   thirds of the screen is seal and sky, that leaves most of the
   window ignoring you. Every wheel is taken instead and handed to
   the column.

   Taking the wheel also means owning the feel of it. Setting
   scrollTop straight from the delta lands the list on the new
   position in one frame, which is what makes a wheel feel like a
   ratchet. The delta goes to a target instead, and each frame closes
   part of the remaining distance: quick to start, slowing as it
   arrives, and with a run of notches simply extending the same
   glide rather than queueing up jumps.
   ──────────────────────────────────────────────────────────────── */
(() => {
  const index = document.getElementById('index');
  const sheet = document.querySelector('.sheet');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const columnScrolls = () =>
    index.scrollHeight > index.clientHeight + 4 &&
    getComputedStyle(index).overflowY === 'auto';

  const limit = () => Math.max(0, index.scrollHeight - index.clientHeight);
  let target = 0, gliding = false;

  /* CLOSE is how much of the remaining distance goes each frame. It
     is the difference between arriving and jumping: at .18 a notch
     covers a fifth of its journey in the first frame, which still
     reads as a step. Low and slow, so the list is always moving
     rather than repeatedly landing.

     REACH scales the wheel itself. A notch reports 100px or more,
     and three of those in quick succession send the list further
     than anyone meant; at half strength a notch is a nudge and a
     spin is a long, smooth run.

     LEAD stops a fast spin from throwing the target so far ahead
     that the list is still travelling long after you have stopped. */
  const F = FEEL;   /* same script scope, not a window property */

  function frame(){
    if (!gliding) return;
    const at = index.scrollTop, left = target - at;
    if (Math.abs(left) < .6){ index.scrollTop = target; written = index.scrollTop;
                              gliding = false; return; }
    index.scrollTop = at + left * F.close;
    written = index.scrollTop;                 /* so the listener knows it was us */
    requestAnimationFrame(frame);
  }

  function push(dy, rein = true){
    const at = index.scrollTop;
    target = Math.max(0, Math.min(limit(), target + dy));
    /* A spin of the wheel is momentum and should not be allowed to
       throw the list a long way; a key is a destination and should
       arrive, so Home and End are left alone. */
    if (rein){
      const lead = innerHeight * F.lead;
      target = Math.max(at - lead, Math.min(at + lead, target));
    }
    if (still){ index.scrollTop = target; return; }
    if (!gliding){ gliding = true; requestAnimationFrame(frame); }
  }

  /* Anything that moves the list some other way, a drag of the
     scrollbar most of all, has to win. The glide writes scrollTop
     every frame, so a drag was being overwritten before the thumb
     could go anywhere: the bar looked broken. Every scroll is now
     compared against the last value written here, and anything else
     is taken as the user's own doing, which ends the glide and
     hands the position over. */
  let written = -1;
  index.addEventListener('scroll', () => {
    if (Math.abs(index.scrollTop - written) < 1.5) return;   /* our own frame */
    target = index.scrollTop;
    gliding = false;
  }, { passive:true });

  addEventListener('wheel', e => {
    if (!columnScrolls()) return;
    if (sheet.classList.contains('on') && sheet.contains(e.target)) return;
    const step = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
    push(e.deltaY * step * F.reach);
    e.preventDefault();
  }, { passive:false });

  addEventListener('keydown', e => {
    if (!columnScrolls()) return;
    const t = e.target;
    if (t !== document.body && t !== document.documentElement) return;
    const jump = { ArrowDown:120, ArrowUp:-120, PageDown:innerHeight * .8,
                   PageUp:-innerHeight * .8, Home:-1e7, End:1e7 }[e.key];
    if (jump === undefined) return;
    push(jump, false);
    e.preventDefault();
  });
})();

/* ── language ─────────────────────────────────────────────────
   The whole page is rebuilt in the other language rather than
   translated in place, which keeps one code path for both and means
   a missing Japanese string can never leave a stale English one
   behind. The choice rides in the URL, so a Japanese reader can be
   sent straight to the Japanese page.
   ──────────────────────────────────────────────────────────────── */
(() => {
  const btn = document.getElementById('lang');
  const paint = () => btn.querySelectorAll('span').forEach(sp =>
    sp.classList.toggle('on', sp.dataset.l === LANG));

  btn.addEventListener('click', () => {
    LANG = LANG === 'ja' ? 'en' : 'ja';
    history.replaceState(null, '', LANG === 'ja' ? '#ja' : location.pathname);
    render(); paint(); window.repaintInk && window.repaintInk();
    window.redrawMark && window.redrawMark();
  });
  addEventListener('hashchange', () => {
    const want = location.hash === '#ja' ? 'ja' : 'en';
    if (want === LANG) return;
    LANG = want; render(); paint(); window.repaintInk && window.repaintInk();
    window.redrawMark && window.redrawMark();
  });
  paint();
})();

/* ── the seal's card ─────────────────────────────────────────────
   Hover on pointer devices, tap on touch. Clicking pins it open so
   the map link stays reachable.
   ──────────────────────────────────────────────────────────────── */
(() => {
  const seal = document.querySelector('.hanko');
  const card = document.getElementById('sealCard');
  const canHover = matchMedia('(hover: hover)').matches;
  let pinned = false, t = null;

  document.getElementById('sealCardImg').src = SEAL.SRC;

  const show = () => {
    clearTimeout(t);
    card.classList.add('on');
    seal.classList.add('hot');
    SEAL.agitate(true);
  };
  const hide = now => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (pinned) return;
      card.classList.remove('on');
      seal.classList.remove('hot');
      SEAL.agitate(false);
    }, now ? 0 : 200);
  };

  if (canHover){
    seal.addEventListener('mouseenter', show);
    seal.addEventListener('mouseleave', () => hide());
    card.addEventListener('mouseenter', () => clearTimeout(t));
    card.addEventListener('mouseleave', () => hide());
  }

  seal.addEventListener('click', e => {
    e.stopPropagation();
    pinned = !pinned;
    pinned ? show() : hide(true);
  });
  seal.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); seal.click(); }
  });

  document.addEventListener('click', e => {
    if (pinned && !card.contains(e.target)){ pinned = false; hide(true); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && pinned){ pinned = false; hide(true); }
  });
  /* only dismiss once the page has genuinely moved — trackpads emit a
     constant dribble of scroll events that would otherwise close it
     the instant it opened */
  let openedAt = 0;
  addEventListener('scroll', () => {
    if (!card.classList.contains('on')) return;
    if (Math.abs(scrollY - openedAt) < 60) return;
    pinned = false; hide(true);
  }, { passive:true });
  const mark = () => { openedAt = scrollY; };
  seal.addEventListener('mouseenter', mark);
  seal.addEventListener('click', mark);
})();



</script>
</body>
